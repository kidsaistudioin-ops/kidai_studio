<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Mascot (Rocket + Palette Star) -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="22" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="3"/>
    
    <!-- Rocket Core -->
    <g transform="translate(16, 12) scale(0.65)" filter="url(#logoGlow)">
      <!-- Flame -->
      <path d="M38,70 Q30,95 38,105 Q46,95 38,70 Z" fill="#f59e0b"/>
      <!-- Fins -->
      <path d="M22,55 L8,75 Q26,75 30,62 Z" fill="#7c3aed"/>
      <path d="M54,55 L68,75 Q50,75 46,62 Z" fill="#7c3aed"/>
      <!-- Body -->
      <path d="M38,5 Q56,20 54,65 L22,65 Q20,20 38,5 Z" fill="url(#brandGrad)"/>
      <!-- Window -->
      <circle cx="38" cy="35" r="10" fill="#07090f" stroke="#06b6d4" stroke-width="3"/>
      <circle cx="38" cy="35" r="5" fill="#06b6d4"/>
    </g>

    <!-- Star Glow -->
    <circle cx="68" cy="20" r="4" fill="#f59e0b"/>
    <circle cx="16" cy="65" r="3" fill="#06b6d4"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(105, 58)">
    <text font-family="'Nunito', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="1">
      KID<tspan fill="url(#brandGrad)">AI</tspan>
    </text>
    <text x="138" y="-2" font-family="'Nunito', sans-serif" font-weight="900" font-size="20" fill="#06b6d4" letter-spacing="3">
      STUDIO
    </text>
    <text x="0" y="24" font-family="'Nunito', sans-serif" font-weight="800" font-size="12" fill="#94a3b8" letter-spacing="1.5">
      LEARN • CREATE • PLAY WITH AI
    </text>
  </g>
</svg>

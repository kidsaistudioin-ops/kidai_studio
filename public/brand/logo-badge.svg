<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="#0f172a" stroke="url(#badgeGrad)" stroke-width="6" filter="url(#badgeGlow)"/>
  <circle cx="100" cy="100" r="82" fill="#07090f" stroke="#1e293b" stroke-width="2"/>

  <!-- Center Mascot Rocket -->
  <g transform="translate(62, 35) scale(0.95)" filter="url(#badgeGlow)">
    <!-- Flame -->
    <path d="M40,75 Q32,105 40,118 Q48,105 40,75 Z" fill="url(#goldGrad)"/>
    <!-- Fins -->
    <path d="M22,60 L6,82 Q26,82 30,68 Z" fill="#7c3aed"/>
    <path d="M58,60 L74,82 Q54,82 50,68 Z" fill="#7c3aed"/>
    <!-- Body -->
    <path d="M40,6 Q60,24 58,70 L22,70 Q20,24 40,6 Z" fill="url(#badgeGrad)"/>
    <!-- Window -->
    <circle cx="40" cy="38" r="12" fill="#07090f" stroke="#06b6d4" stroke-width="4"/>
    <circle cx="40" cy="38" r="6" fill="#06b6d4"/>
    <circle cx="43" cy="35" r="2" fill="#ffffff"/>
  </g>

  <!-- Bottom Brand Arc Text -->
  <text x="100" y="174" font-family="'Nunito', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    KID<tspan fill="#ff6b35">AI</tspan>
  </text>
</svg>
